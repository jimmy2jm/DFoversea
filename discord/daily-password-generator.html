<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Password Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            color: #ccc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            gap: 1.5rem;
        }
        h1 { font-size: 1.2rem; color: #aaa; font-weight: 500; }
        .inputs {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .input-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .input-item label {
            font-size: 11px;
            color: #666;
        }
        .input-item input {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 14px;
            width: 90px;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            letter-spacing: 3px;
        }
        .input-item input:focus {
            outline: none;
            border-color: #555;
        }
        .btns {
            display: flex;
            gap: 8px;
        }
        button {
            padding: 6px 16px;
            border: 1px solid #333;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            background: #1a1a1a;
            color: #aaa;
            transition: all 0.15s;
        }
        button:hover {
            background: #252525;
            color: #fff;
            border-color: #555;
        }
        .canvas-wrap {
            border: 1px solid #222;
            border-radius: 4px;
            overflow: hidden;
        }
        canvas { display: block; max-width: 100%; height: auto; }
        .toast {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%) translateY(-60px);
            background: #333;
            color: #fff;
            padding: 8px 20px;
            border-radius: 4px;
            font-size: 13px;
            transition: transform 0.25s;
            z-index: 10;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <h1>Daily Password Image Generator</h1>

    <div class="inputs">
        <div class="input-item">
            <label>Dam 零号大坝</label>
            <input type="text" id="code-dam" value="4861" maxlength="4">
        </div>
        <div class="input-item">
            <label>Valley 长弓溪谷</label>
            <input type="text" id="code-valley" value="7325" maxlength="4">
        </div>
        <div class="input-item">
            <label>Bakshi 巴克什</label>
            <input type="text" id="code-bakshi" value="6183" maxlength="4">
        </div>
        <div class="input-item">
            <label>Space 航天基地</label>
            <input type="text" id="code-space" value="2957" maxlength="4">
        </div>
        <div class="input-item">
            <label>Prison 潮汐监狱</label>
            <input type="text" id="code-prison" value="1479" maxlength="4">
        </div>
    </div>

    <div class="btns">
        <button onclick="generateImage()">Generate</button>
        <button onclick="downloadImage()">Download PNG</button>
        <button onclick="copyToClipboard()">Copy</button>
    </div>

    <div class="canvas-wrap">
        <canvas id="poster" width="720" height="280"></canvas>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const maps = [
            { id: 'dam',    name: 'Dam',       cn: '零号大坝',  color: '#5ca0d3' },
            { id: 'valley', name: 'Valley',    cn: '长弓溪谷',  color: '#6ab87a' },
            { id: 'bakshi', name: 'Bakshi',    cn: '巴克什',    color: '#d4944a' },
            { id: 'space',  name: 'Space Lab', cn: '航天基地',  color: '#9b6abf' },
            { id: 'prison', name: 'Prison',    cn: '潮汐监狱',  color: '#d45a5a' }
        ];

        function dateStr() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function rr(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x+r, y);
            ctx.arcTo(x+w, y, x+w, y+h, r);
            ctx.arcTo(x+w, y+h, x, y+h, r);
            ctx.arcTo(x, y+h, x, y, r);
            ctx.arcTo(x, y, x+w, y, r);
            ctx.closePath();
        }

        function generateImage() {
            const c = document.getElementById('poster');
            const ctx = c.getContext('2d');
            const W = 720, H = 280;

            // Background
            ctx.fillStyle = '#0e1117';
            ctx.fillRect(0, 0, W, H);

            // Header
            ctx.fillStyle = '#ffffff';
            ctx.font = '600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('DAILY PASSWORD', 28, 36);

            ctx.fillStyle = '#555';
            ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(dateStr() + '  ·  Resets 00:00 UTC', W - 28, 36);

            // Thin divider
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(28, 52);
            ctx.lineTo(W - 28, 52);
            ctx.stroke();

            // Cards
            const cardW = 118;
            const cardH = 160;
            const startY = 68;
            const totalW = cardW * 5 + 16 * 4;
            const startX = (W - totalW) / 2;

            maps.forEach((m, i) => {
                const code = document.getElementById('code-' + m.id).value || '----';
                const x = startX + i * (cardW + 16);
                const y = startY;

                // Card bg
                rr(ctx, x, y, cardW, cardH, 6);
                ctx.fillStyle = '#161b22';
                ctx.fill();
                rr(ctx, x, y, cardW, cardH, 6);
                ctx.strokeStyle = '#252b35';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Top color bar
                ctx.fillStyle = m.color;
                ctx.fillRect(x + 1, y + 1, cardW - 2, 3);

                // Map name
                ctx.fillStyle = '#ccc';
                ctx.font = '600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(m.name, x + cardW / 2, y + 32);

                // Chinese name
                ctx.fillStyle = '#555';
                ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
                ctx.fillText(m.cn, x + cardW / 2, y + 50);

                // Divider
                ctx.strokeStyle = '#252b35';
                ctx.beginPath();
                ctx.moveTo(x + 14, y + 62);
                ctx.lineTo(x + cardW - 14, y + 62);
                ctx.stroke();

                // Code box
                rr(ctx, x + 10, y + 76, cardW - 20, 48, 4);
                ctx.fillStyle = '#0d1117';
                ctx.fill();
                rr(ctx, x + 10, y + 76, cardW - 20, 48, 4);
                ctx.strokeStyle = m.color + '40';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Code digits
                ctx.fillStyle = m.color;
                ctx.font = 'bold 24px "Courier New", monospace';
                ctx.textAlign = 'center';
                const s = code.padEnd(4, '-');
                const sp = 18;
                const sx = x + cardW / 2 - sp * 1.5;
                for (let d = 0; d < 4; d++) {
                    ctx.fillText(s[d], sx + d * sp, y + 107);
                }

                // Small label
                ctx.fillStyle = '#444';
                ctx.font = '9px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
                ctx.fillText('SECRET CODE', x + cardW / 2, y + 145);
            });

            // Footer
            ctx.fillStyle = '#333';
            ctx.font = '10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Delta Force  ·  Hazard Operations  ·  ' + dateStr(), W / 2, H - 14);
        }

        function downloadImage() {
            generateImage();
            const c = document.getElementById('poster');
            const a = document.createElement('a');
            a.download = `daily-password-${dateStr()}.png`;
            a.href = c.toDataURL('image/png');
            a.click();
            showToast('Downloaded ✓');
        }

        async function copyToClipboard() {
            generateImage();
            const c = document.getElementById('poster');
            try {
                const blob = await new Promise(r => c.toBlob(r, 'image/png'));
                await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
                showToast('Copied ✓');
            } catch (e) {
                showToast('Copy failed');
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        generateImage();
        document.querySelectorAll('input').forEach(el => el.addEventListener('input', generateImage));
    </script>
</body>
</html>
