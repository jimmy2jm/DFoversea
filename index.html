<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Force Tool Station</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 64% 0%, rgba(126, 146, 139, 0.22) 0, transparent 30%),
                linear-gradient(180deg, #0b2022 0%, #071c1e 48%, #07191a 100%);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 40px 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 12px;
            color: #24f4b2;
        }
        p {
            color: #9ca3af;
            margin-bottom: 40px;
            font-size: 14px;
        }
        .links {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        a {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 180px;
            height: 120px;
            background: rgba(18, 38, 42, 0.92);
            border: 1px solid rgba(84, 112, 118, 0.56);
            border-radius: 0;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.86);
            transition: all 0.2s;
        }
        a:hover {
            background: rgba(36, 244, 178, 0.08);
            border-color: #24f4b2;
            color: #24f4b2;
        }
        a .icon { font-size: 36px; margin-bottom: 10px; }
        a .label { font-size: 15px; font-weight: 600; }
    </style>
    <script>
        // 自动检测设备并跳转
        (function() {
            var ua = navigator.userAgent.toLowerCase();
            var isMobile = /iphone|ipad|ipod|android|mobile/.test(ua);
            if (isMobile) {
                window.location.href = './mobile/mobile-prototype.html';
            } else {
                window.location.href = './desktop/index.html';
            }
        })();
    </script>
</head>
<body>
    <div class="container">
        <h1>Delta Force Tool Station</h1>
        <p>Choose your version / 选择版本</p>
        <div class="links">
            <a href="./desktop/index.html">
                <span class="icon">🖥️</span>
                <span class="label">Desktop</span>
            </a>
            <a href="./mobile/mobile-prototype.html">
                <span class="icon">📱</span>
                <span class="label">Mobile</span>
            </a>
        </div>
    </div>
</body>
</html>
