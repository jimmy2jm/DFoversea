<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Force Tool Station</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #0a0e13;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 40px 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #00d4aa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #9ca3af;
            margin-bottom: 40px;
            font-size: 14px;
        }
        .links {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        a {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 180px;
            height: 120px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            text-decoration: none;
            color: #fff;
            transition: all 0.2s;
        }
        a:hover {
            background: rgba(0, 212, 170, 0.08);
            border-color: #00d4aa;
            transform: translateY(-2px);
        }
        a .icon { font-size: 36px; margin-bottom: 10px; }
        a .label { font-size: 15px; font-weight: 600; }
    </style>
    <script>
        // 自动检测设备并跳转
        (function() {
            var ua = navigator.userAgent.toLowerCase();
            var isMobile = /iphone|ipad|ipod|android|mobile/.test(ua);
            if (isMobile) {
                window.location.href = './mobile/mobile-prototype.html';
            } else {
                window.location.href = './desktop/index.html';
            }
        })();
    </script>
</head>
<body>
    <div class="container">
        <h1>Delta Force Tool Station</h1>
        <p>Choose your version / 选择版本</p>
        <div class="links">
            <a href="./desktop/index.html">
                <span class="icon">🖥️</span>
                <span class="label">Desktop</span>
            </a>
            <a href="./mobile/mobile-prototype.html">
                <span class="icon">📱</span>
                <span class="label">Mobile</span>
            </a>
        </div>
    </div>
</body>
</html>
