<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Force - 改枪推荐</title>
    <link rel="stylesheet" href="main.css?v=40">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="nav-left">
            <div class="logo">
                <span class="logo-icon">△</span>
                <span class="logo-text">DELTA FORCE</span>
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="gun-builds.html" class="nav-link active">改枪推荐</a>
                <a href="my-data.html" class="nav-link">我的数据</a>
                <a href="collection.html" class="nav-link">大红藏馆</a>
                <a href="craft.html" class="nav-link">制造推荐</a>
                <a href="guide.html" class="nav-link">实用攻略</a>
                <a href="map-tools.html" class="nav-link">地图工具</a>
            </div>
        </div>
        <div class="nav-right">
            <div class="user-icon"></div>
            <button class="logout-btn">log out</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-container">
        <!-- 烽火/战场 模式切换Tab -->
        <div class="gun-mode-tabs">
            <div class="gun-mode-tab active" data-mode="fenghuo">
                <span class="mode-icon">🔥</span>
                <span class="mode-name">烽火地带</span>
            </div>
            <div class="gun-mode-tab" data-mode="zhanchang">
                <span class="mode-icon">⚔️</span>
                <span class="mode-name">全面战场</span>
            </div>
        </div>

        <!-- 烽火地带内容 -->
        <div class="gun-mode-content" id="fenghuo-content">
            <!-- 改枪码推荐区域 -->
            <section class="gun-builds-section">
                <div class="section-header">
                    <span class="section-title">🔧 改枪码推荐</span>
                </div>
                
                <!-- 枪械选择栏 -->
                <div class="gun-selector">
                    <div class="gun-tab active" data-gun="mp5">
                        <div class="gun-tab-image"></div>
                        <span class="gun-tab-name">MP5</span>
                    </div>
                    <div class="gun-tab" data-gun="ak74">
                        <div class="gun-tab-image"></div>
                        <span class="gun-tab-name">AK-74M</span>
                    </div>
                    <div class="gun-tab" data-gun="m4a1">
                        <div class="gun-tab-image"></div>
                        <span class="gun-tab-name">M4A1</span>
                    </div>
                    <div class="gun-tab" data-gun="scar">
                        <div class="gun-tab-image"></div>
                        <span class="gun-tab-name">SCAR-H</span>
                    </div>
                    <div class="gun-tab" data-gun="vss">
                        <div class="gun-tab-image"></div>
                        <span class="gun-tab-name">VSS</span>
                    </div>
                </div>
                
                <!-- 改装方案区 - 烽火（两个方案） -->
                <div class="gun-builds-content" id="gun-builds-content-fh">
                    <!-- 性价比改法 -->
                    <div class="build-card budget">
                        <button class="copy-code-btn-float">复制</button>
                        <div class="build-header">
                            <span class="build-type budget-type">💰 85K 性价比改法</span>
                            <div class="build-tags">
                                <span class="build-tag">中近距离</span>
                                <span class="build-tag">满腰射</span>
                            </div>
                        </div>
                        <div class="build-gun-image"></div>
                        <div class="build-details">
                            <div class="build-radar">
                                <canvas class="radar-chart" id="radar-budget-fh"></canvas>
                                <div class="radar-labels">
                                    <span class="radar-label label-top">后坐力控制</span>
                                    <span class="radar-label label-right-top">操控速度</span>
                                    <span class="radar-label label-right-bottom">射程优势</span>
                                    <span class="radar-label label-left-bottom">持枪稳定性</span>
                                    <span class="radar-label label-left-top">射速</span>
                                </div>
                            </div>
                            <div class="build-attachments">
                                <div class="attachment-icon" title="枪口"></div>
                                <div class="attachment-icon" title="瞄具"></div>
                                <div class="attachment-icon" title="握把"></div>
                                <div class="attachment-icon" title="弹匣"></div>
                                <div class="attachment-icon" title="枪托"></div>
                                <div class="attachment-icon" title="护木"></div>
                                <div class="attachment-icon" title="激光"></div>
                                <div class="attachment-icon" title="战术"></div>
                            </div>
                        </div>
                        <div class="build-footer">
                            <button class="view-detail-btn">查看改装详情</button>
                        </div>
                    </div>
                    
                    <!-- 满改方案 -->
                    <div class="build-card premium">
                        <button class="copy-code-btn-float">复制</button>
                        <div class="build-header">
                            <span class="build-type premium-type">💎 157K 满改方案</span>
                            <div class="build-tags">
                                <span class="build-tag">长距离</span>
                                <span class="build-tag">高精准</span>
                            </div>
                        </div>
                        <div class="build-gun-image"></div>
                        <div class="build-details">
                            <div class="build-radar">
                                <canvas class="radar-chart" id="radar-premium-fh"></canvas>
                                <div class="radar-labels">
                                    <span class="radar-label label-top">后坐力控制</span>
                                    <span class="radar-label label-right-top">操控速度</span>
                                    <span class="radar-label label-right-bottom">射程优势</span>
                                    <span class="radar-label label-left-bottom">持枪稳定性</span>
                                    <span class="radar-label label-left-top">射速</span>
                                </div>
                            </div>
                            <div class="build-attachments">
                                <div class="attachment-icon" title="枪口"></div>
                                <div class="attachment-icon" title="瞄具"></div>
                                <div class="attachment-icon" title="握把"></div>
                                <div class="attachment-icon" title="弹匣"></div>
                                <div class="attachment-icon" title="枪托"></div>
                                <div class="attachment-icon" title="护木"></div>
                                <div class="attachment-icon" title="激光"></div>
                                <div class="attachment-icon" title="战术"></div>
                            </div>
                        </div>
                        <div class="build-footer">
                            <button class="view-detail-btn">查看改装详情</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 枪械列表区域 - 烽火 -->
            <section class="gun-list-section">
                <div class="section-header">
                    <span class="section-title">🔫 枪械列表</span>
                </div>
                
                <!-- 筛选栏 - 烽火（枪械类型 + 枪械价格） -->
                <div class="gun-filter-bar">
                    <div class="gun-filter-group">
                        <label class="filter-label">枪械类型</label>
                        <select class="gun-filter-select" id="gun-type-filter-fh">
                            <option value="all">全部类型</option>
                            <option value="ar">突击步枪</option>
                            <option value="smg">冲锋枪</option>
                            <option value="sr">狙击步枪</option>
                            <option value="lmg">轻机枪</option>
                            <option value="sg">霰弹枪</option>
                            <option value="pistol">手枪</option>
                        </select>
                    </div>
                    <div class="gun-filter-group">
                        <label class="filter-label">枪械价格</label>
                        <select class="gun-filter-select" id="gun-price-filter-fh">
                            <option value="all">全部价格</option>
                            <option value="0-50000">5万以下</option>
                            <option value="50000-100000">5-10万</option>
                            <option value="100000-200000">10-20万</option>
                            <option value="200000+">20万以上</option>
                        </select>
                    </div>
                </div>
                
                <!-- 枪械列表内容 - 新结构 -->
                <div class="gun-list-content" id="gun-list-content-fh">
                    <!-- 横向枪械选择列表 - 带滚动容器 -->
                    <div class="gun-horizontal-wrapper">
                        <div class="gun-horizontal-list" id="gun-horizontal-list-fh">
                            <!-- JS动态生成 -->
                        </div>
                        <!-- 右侧滚动引导箭头 -->
                        <div class="gun-scroll-arrow" id="gun-scroll-arrow-fh">
                            <span class="arrow-icon">›</span>
                        </div>
                    </div>
                    
                    <!-- 选中枪械的改装方案 - 纵向列表 -->
                    <div class="gun-build-schemes-list" id="gun-build-schemes-fh">
                        <!-- JS动态生成方案列表 -->
                    </div>
                </div>
            </section>
        </div>

        <!-- 全面战场内容 -->
        <div class="gun-mode-content" id="zhanchang-content" style="display: none;">
            <!-- 改枪码推荐区域 -->
            <section class="gun-builds-section">
                <div class="section-header">
                    <span class="section-title">🔧 改枪码推荐</span>
                </div>
                
                <!-- 枪械选择栏 -->
                <div class="gun-selector">
                    <div class="gun-tab active" data-gun="m4a1">
                        <div class="gun-tab-image"></div>
                        <span class="gun-tab-name">M4A1</span>
                    </div>
                    <div class="gun-tab" data-gun="ak74">
                        <div class="gun-tab-image"></div>
                        <span class="gun-tab-name">AK-74M</span>
                    </div>
                    <div class="gun-tab" data-gun="hk416">
                        <div class="gun-tab-image"></div>
                        <span class="gun-tab-name">HK416</span>
                    </div>
                    <div class="gun-tab" data-gun="aug">
                        <div class="gun-tab-image"></div>
                        <span class="gun-tab-name">AUG</span>
                    </div>
                    <div class="gun-tab" data-gun="svd">
                        <div class="gun-tab-image"></div>
                        <span class="gun-tab-name">SVD</span>
                    </div>
                </div>
                
                <!-- 改装方案区 - 战场（单个方案，全宽） -->
                <div class="gun-builds-content single-build" id="gun-builds-content-zc">
                    <div class="build-card single">
                        <button class="copy-code-btn-float">复制</button>
                        <div class="build-header">
                            <span class="build-type single-type">🎯 推荐改装方案</span>
                            <div class="build-tags">
                                <span class="build-tag">中远距离</span>
                                <span class="build-tag">高稳定</span>
                                <span class="build-tag">PVP优化</span>
                            </div>
                        </div>
                        <div class="build-gun-image"></div>
                        <div class="build-details">
                            <div class="build-radar">
                                <canvas class="radar-chart" id="radar-single-zc"></canvas>
                                <div class="radar-labels">
                                    <span class="radar-label label-top">后坐力控制</span>
                                    <span class="radar-label label-right-top">操控速度</span>
                                    <span class="radar-label label-right-bottom">射程优势</span>
                                    <span class="radar-label label-left-bottom">持枪稳定性</span>
                                    <span class="radar-label label-left-top">射速</span>
                                </div>
                            </div>
                            <div class="build-attachments">
                                <div class="attachment-icon" title="枪口"></div>
                                <div class="attachment-icon" title="瞄具"></div>
                                <div class="attachment-icon" title="握把"></div>
                                <div class="attachment-icon" title="弹匣"></div>
                                <div class="attachment-icon" title="枪托"></div>
                                <div class="attachment-icon" title="护木"></div>
                                <div class="attachment-icon" title="激光"></div>
                                <div class="attachment-icon" title="战术"></div>
                            </div>
                        </div>
                        <div class="build-footer">
                            <button class="view-detail-btn">查看改装详情</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 枪械列表区域 - 战场 -->
            <section class="gun-list-section">
                <div class="section-header">
                    <span class="section-title">🔫 枪械列表</span>
                </div>
                
                <!-- 筛选栏 - 战场（仅枪械类型） -->
                <div class="gun-filter-bar">
                    <div class="gun-filter-group">
                        <label class="filter-label">枪械类型</label>
                        <select class="gun-filter-select" id="gun-type-filter-zc">
                            <option value="all">全部类型</option>
                            <option value="ar">突击步枪</option>
                            <option value="smg">冲锋枪</option>
                            <option value="sr">狙击步枪</option>
                            <option value="lmg">轻机枪</option>
                            <option value="sg">霰弹枪</option>
                            <option value="pistol">手枪</option>
                        </select>
                    </div>
                </div>
                
                <!-- 枪械列表内容 - 新结构 -->
                <div class="gun-list-content" id="gun-list-content-zc">
                    <!-- 横向枪械选择列表 - 带滚动容器 -->
                    <div class="gun-horizontal-wrapper">
                        <div class="gun-horizontal-list" id="gun-horizontal-list-zc">
                            <!-- JS动态生成 -->
                        </div>
                        <!-- 右侧滚动引导箭头 -->
                        <div class="gun-scroll-arrow" id="gun-scroll-arrow-zc">
                            <span class="arrow-icon">›</span>
                        </div>
                    </div>
                    
                    <!-- 选中枪械的改装方案 - 纵向列表 -->
                    <div class="gun-build-schemes-list" id="gun-build-schemes-zc">
                        <!-- JS动态生成方案列表 -->
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="../shared/mock-data.js?v=1"></script>
    <script src="main.js?v=17"></script>
</body>
</html>
