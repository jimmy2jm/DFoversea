<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Force - 物价监控</title>
    <link rel="stylesheet" href="main.css?v=44">
    <link rel="stylesheet" href="craft-page.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        .market-overview-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 18px;
        }
        .market-overview-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
        }
        .market-overview-label {
            display: block;
            color: var(--text-secondary);
            font-size: 12px;
            margin-bottom: 8px;
        }
        .market-overview-value {
            display: block;
            color: var(--text-primary);
            font-size: 22px;
            font-weight: 800;
            font-family: 'Orbitron', monospace;
        }
        .market-overview-value.positive { color: #4ade80; }
        .market-overview-value.negative { color: #ef4444; }
        .market-overview-hint {
            display: block;
            color: var(--text-secondary);
            font-size: 11px;
            margin-top: 8px;
        }
        @media (max-width: 900px) {
            .market-overview-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <div class="nav-left">
            <div class="logo">
                <span class="logo-icon">△</span>
                <span class="logo-text">DELTA FORCE</span>
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="gun-plans.html" class="nav-link">改枪方案</a>
                <a href="my-data.html" class="nav-link">我的数据</a>
                <a href="market-monitor.html" class="nav-link active">物价监控</a>
            </div>
        </div>
        <div class="nav-right">
            <button class="desktop-login-btn" id="desktop-login-btn">登录 / 注册</button>
            <div class="desktop-user-info" id="desktop-user-info" style="display: none;">
                <img class="desktop-user-avatar" id="desktop-user-avatar" src="" alt="" style="display: none;">
                <span class="desktop-user-email" id="desktop-user-email"></span>
                <span class="desktop-user-dropdown-arrow">▾</span>
            </div>
        </div>
    </nav>

    <main class="main-container craft-page-container">
        <div class="page-header">
            <h1 class="page-title">💹 物价监控</h1>
            <p class="page-subtitle">查看交易行情、涨跌榜、分类物品与价格排序</p>
        </div>

        <section class="market-overview-grid">
            <div class="market-overview-card">
                <span class="market-overview-label">今日监控物品</span>
                <span class="market-overview-value">90+</span>
                <span class="market-overview-hint">覆盖枪械、装备、配件、收集品等</span>
            </div>
            <div class="market-overview-card">
                <span class="market-overview-label">最高涨幅</span>
                <span class="market-overview-value positive">+15.2%</span>
                <span class="market-overview-hint">动力电池组</span>
            </div>
            <div class="market-overview-card">
                <span class="market-overview-label">最大跌幅</span>
                <span class="market-overview-value negative">-5.3%</span>
                <span class="market-overview-hint">普通绷带</span>
            </div>
            <div class="market-overview-card">
                <span class="market-overview-label">更新时间</span>
                <span class="market-overview-value" id="chart-update-time">--:--</span>
                <span class="market-overview-hint">基于当前原型 Mock 数据</span>
            </div>
        </section>

        <section class="market-price-section">
            <div class="section-header">
                <span class="section-title">💹 交易物价列表</span>
            </div>

            <div class="market-search-container">
                <span class="search-icon">🔍</span>
                <input type="text" class="market-search-input" id="market-search-input" placeholder="搜索物品名称...">
                <span class="search-clear" id="market-search-clear">✕</span>
            </div>

            <div class="market-filter-row">
                <select class="market-category-select" id="market-page-category">
                    <option value="all">全部分类</option>
                    <option value="guns">枪械</option>
                    <option value="armor">装备</option>
                    <option value="parts">配件</option>
                    <option value="collect">收集品</option>
                    <option value="medical">医疗品</option>
                    <option value="ammo">弹药</option>
                </select>
            </div>

            <div class="market-list-header">
                <span class="header-col name-col">物品名称</span>
                <span class="header-col price-col sortable" data-sort="price" id="sort-price-desktop">
                    价值 <span class="sort-arrow">↕</span>
                </span>
                <span class="header-col change-col sortable" data-sort="change" id="sort-change-desktop">
                    涨跌幅 <span class="sort-arrow">↕</span>
                </span>
            </div>

            <div class="market-items-list" id="market-items-list"></div>
        </section>
    </main>

    <script src="../shared/mock-data.js?v=2"></script>
    <script src="craft-page.js?v=2"></script>
</body>
</html>
