<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Force - 交易制造</title>
    <link rel="stylesheet" href="main.css?v=38">
    <link rel="stylesheet" href="craft-page.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="nav-left">
            <div class="logo">
                <span class="logo-icon">△</span>
                <span class="logo-text">DELTA FORCE</span>
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="gun-builds.html" class="nav-link">改枪推荐</a>
                <a href="my-data.html" class="nav-link">我的数据</a>
                <a href="collection.html" class="nav-link">大红藏馆</a>
                <a href="craft.html" class="nav-link active">交易制造</a>
                <a href="guide.html" class="nav-link">实用攻略</a>
                <a href="map-tools.html" class="nav-link">地图工具</a>
            </div>
        </div>
        <div class="nav-right">
            <button class="desktop-login-btn" id="desktop-login-btn" data-i18n="login.loginRegister">登录 / 注册</button>
            <div class="desktop-user-info" id="desktop-user-info" style="display: none;">
                <img class="desktop-user-avatar" id="desktop-user-avatar" src="" alt="" style="display: none;">
                <span class="desktop-user-email" id="desktop-user-email"></span>
                <span class="desktop-user-dropdown-arrow">▾</span>
                <div class="desktop-user-dropdown" id="desktop-user-dropdown">
                    <div class="desktop-dropdown-item" id="desktop-dropdown-feedback">
                        <span class="desktop-dropdown-icon">💬</span>
                        <span data-i18n="feedback.title">意见反馈</span>
                    </div>
                    <div class="desktop-dropdown-item logout" id="desktop-dropdown-logout">
                        <span class="desktop-dropdown-icon">🚪</span>
                        <span data-i18n="common.logOut">退出登录</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-container craft-page-container">
        <!-- 页面标题 -->
        <div class="page-header">
            <h1 class="page-title">🏭 交易制造</h1>
            <p class="page-subtitle">制造推荐与物价实时行情</p>
        </div>

        <!-- ============================================
             制造推荐模块（横屏适配）
             ============================================ -->
        <section class="craft-recommend-section">
            <div class="section-header">
                <span class="section-title">🔨 制造推荐</span>
                <span class="header-date" id="craft-date">2026/02/05</span>
            </div>
            
            <!-- Tab 切换栏 -->
            <div class="craft-tabs-row">
                <button class="craft-tab-btn active" data-craft="tech">技术中心</button>
                <button class="craft-tab-btn" data-craft="work">工作台</button>
                <button class="craft-tab-btn" data-craft="med">制药台</button>
                <button class="craft-tab-btn" data-craft="armor">防具台</button>
            </div>
            
            <!-- 推荐物品横向列表 -->
            <div class="craft-items-row" id="craft-items-row">
                <!-- JS动态填充 -->
            </div>
            
            <!-- 价格走势图区域 -->
            <div class="craft-chart-area">
                <div class="chart-legend-row">
                    <div class="legend-items">
                        <span class="legend-item"><i class="legend-dot price"></i>总售价</span>
                        <span class="legend-item"><i class="legend-dot profit"></i>总收益</span>
                        <span class="legend-item"><i class="legend-dot cost"></i>总成本</span>
                    </div>
                    <span class="chart-update-time" id="chart-update-time">更新于 2026-02-05 11:00</span>
                </div>
                <div class="craft-chart-container">
                    <canvas id="craft-page-chart"></canvas>
                </div>
            </div>
        </section>

        <!-- ============================================
             交易物价列表模块
             ============================================ -->
        <section class="market-price-section">
            <div class="section-header">
                <span class="section-title">💹 交易物价</span>
            </div>
            
            <!-- 搜索框 -->
            <div class="market-search-container">
                <span class="search-icon">🔍</span>
                <input type="text" class="market-search-input" id="market-search-input" placeholder="搜索物品名称...">
                <span class="search-clear" id="market-search-clear">✕</span>
            </div>
            
            <!-- 筛选项 -->
            <div class="market-filter-row">
                <select class="market-category-select" id="market-page-category">
                    <option value="all">全部分类</option>
                    <option value="guns">枪械</option>
                    <option value="armor">装备</option>
                    <option value="parts">配件</option>
                    <option value="collect">收集品</option>
                    <option value="medical">医疗品</option>
                    <option value="ammo">弹药</option>
                </select>
            </div>
            
            <!-- 表头 -->
            <div class="market-list-header">
                <span class="header-col name-col">物品名称</span>
                <span class="header-col price-col sortable" data-sort="price" id="sort-price-desktop">
                    价值 <span class="sort-arrow">↕</span>
                </span>
                <span class="header-col change-col sortable" data-sort="change" id="sort-change-desktop">
                    涨跌幅 <span class="sort-arrow">↕</span>
                </span>
            </div>
            
            <!-- 物品列表 -->
            <div class="market-items-list" id="market-items-list">
                <!-- JS动态填充 -->
            </div>
        </section>
    </main>


    <!-- 物品详情悬浮窗 -->
    <div class="craft-tooltip" id="craft-tooltip">
        <!-- JS动态填充 -->
    </div>

    <!-- 桌面端反馈弹窗 -->
    <div class="desktop-feedback-overlay" id="desktop-feedback-overlay">
        <div class="desktop-feedback-modal">
            <div class="desktop-feedback-header">
                <span class="desktop-feedback-title" data-i18n="feedback.title">User Feedback</span>
                <span class="desktop-feedback-close" id="desktop-feedback-close">&times;</span>
            </div>
            <div class="desktop-feedback-body">
                <textarea class="feedback-textarea" id="desktop-feedback-textarea" placeholder="Please describe your feedback in detail..." data-i18n-placeholder="feedback.placeholder" rows="5"></textarea>
                <div class="feedback-images-section">
                    <div class="feedback-images-grid" id="desktop-feedback-images-grid"></div>
                    <label class="feedback-upload-btn" id="desktop-feedback-upload-label">
                        <input type="file" accept="image/*" multiple id="desktop-feedback-image-input" style="display:none;">
                        <span class="upload-icon">+</span>
                        <span class="upload-text" data-i18n="feedback.addImage">Add Image</span>
                    </label>
                    <div class="feedback-image-hint" data-i18n="feedback.imageHint">Up to 3 images, max 5MB each</div>
                </div>
                <button class="feedback-submit-btn" id="desktop-feedback-submit" data-i18n="feedback.submit">Submit Feedback</button>
            </div>
        </div>
    </div>

    <script src="../shared/mock-data.js?v=2"></script>
    <script src="craft-page.js?v=2"></script>
</body>
</html>
